name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Import-PowerShellDataFile ./MotorCarrierTaxFiling/MotorCarrierTaxFiling.psd1
          foreach ($dependency in $manifest.RequiredModules) {
            Install-Module $dependency.ModuleName -RequiredVersion $dependency.RequiredVersion -Scope CurrentUser -Force -Repository PSGallery
          }
          Install-Module DataAgent -RequiredVersion 0.4.0 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI
