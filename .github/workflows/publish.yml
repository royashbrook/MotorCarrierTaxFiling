name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest ./MotorCarrierTaxFiling/MotorCarrierTaxFiling.psd1
          if ($env:GITHUB_REF_NAME -ne "v$($manifest.Version)") {
            throw "Release tag $env:GITHUB_REF_NAME does not match module version v$($manifest.Version)."
          }
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Import-PowerShellDataFile ./MotorCarrierTaxFiling/MotorCarrierTaxFiling.psd1
          foreach ($dependency in $manifest.RequiredModules) {
            Install-Module $dependency.ModuleName -RequiredVersion $dependency.RequiredVersion -Scope CurrentUser -Force -Repository PSGallery
          }
      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-Module -Path ./MotorCarrierTaxFiling -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
